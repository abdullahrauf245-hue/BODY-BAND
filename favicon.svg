<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Body Band</title>
  <!-- the console's ink square -->
  <rect width="64" height="64" rx="9" fill="#111111"/>
  <!-- the breath dial: a faint track and a blue arc that is three quarters full -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#2B2B2B" stroke-width="6"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#00A3FF" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="89.5 29.9" transform="rotate(-90 32 32)"/>
  <!-- the heartbeat: the console's red LED -->
  <circle cx="32" cy="32" r="7" fill="#E11D48"/>
</svg>
